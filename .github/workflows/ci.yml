name: CI/CD Copilote Telecom

on:
  push:
    branches: [main, feature/emna-backend-alerts]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Set up database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE copilote_supervision;"
          psql -h localhost -U postgres -d copilote_supervision -f ${{ github.workspace }}/docs/01_schema_postgresql.sql
          psql -h localhost -U postgres -d copilote_supervision -f ${{ github.workspace }}/docs/02_seed_postgresql.sql
          psql -h localhost -U postgres -d copilote_supervision -c "ALTER TABLE utilisateurs ADD COLUMN IF NOT EXISTS mot_de_passe VARCHAR(255) DEFAULT 'test123';"
          psql -h localhost -U postgres -d copilote_supervision -c "UPDATE utilisateurs SET mot_de_passe = 'emna123' WHERE email = 'emna.thouabtia@enicar.ucar.tn';"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/copilote_supervision
          REDIS_URL: redis://localhost:6379
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SECRET_KEY: test-secret-key
        run: |
          cd backend
          python -m pytest tests/test_api.py -v

  build-check:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check frontend build
        run: |
          cd frontend
          npm install
          npm run build