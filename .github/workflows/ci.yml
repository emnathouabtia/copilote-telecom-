name: CI/CD Copilote Telecom

on:
  push:
    branches: [main, feature/emna-backend-alerts]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: copilote_supervision
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Set up database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "ALTER USER postgres PASSWORD 'postgres';"
          psql -h localhost -U postgres -c "CREATE DATABASE copilote_supervision;" || true
          psql -h localhost -U postgres -d copilote_supervision -f docs/01_schema_postgresql.sql
          psql -h localhost -U postgres -d copilote_supervision -f docs/02_seed_postgresql.sql

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/copilote_supervision
          REDIS_URL: redis://localhost:6379
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd backend
          python -m pytest tests/test_api.py -v

  build-check:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend build
        run: |
          cd frontend
          npm install
          npm run build